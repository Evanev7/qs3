[project]
name = "qwen36-vectors"
version = "0.1.0"
description = "Deterministic Qwen3.6 correctness vectors for qs3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qwen36-vectors = "qwen36_vectors:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qwen36_vectors"]
package-dir = { qwen36_vectors = "." }
include-package-data = false

[tool.setuptools.package-data]
qwen36_vectors = ["oracle_hashes/*.json"]
