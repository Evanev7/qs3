[project]
name = "qstriton"
version = "0.1.0"
description = "Triton AOT compilation and Rust launcher generation for qs3"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["triton==3.8.0"]

[project.scripts]
qstriton = "qstriton.builder:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qstriton"]
package-dir = { qstriton = "." }
include-package-data = false

[tool.setuptools.package-data]
qstriton = ["kernels/*.py", "kernels/LICENSE.b12x"]
