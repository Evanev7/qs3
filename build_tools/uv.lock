    { name = "qwen36-vectors" },
]

[package.metadata]
requires-dist = [{ name = "qwen36-vectors", editable = "qwen36-vectors" }]

[[package]]
name = "qwen36-vectors"
version = "0.1.0"
source = { editable = "qwen36-vectors" }
