[project]
name = "build-tools"
version = "0.1.0"
description = "Build-time Python tools for qs3"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["qwen36-vectors", "qstriton"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13,<1",
    "ty>=0.0.61,<0.1",
]


[tool.uv]
package = false

[tool.uv.sources]
qwen36-vectors = { workspace = true }
qstriton = { workspace = true }

[tool.uv.workspace]
members = ["qwen36_vectors", "qstriton"]
