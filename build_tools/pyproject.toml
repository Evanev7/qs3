[project]
name = "build-tools"
version = "0.1.0"
description = "Build-time Python tools for qs3"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dacite>=1.9.2",
    "triton==3.8.0",
]

[project.scripts]
qstriton = "qstriton.builder:main"
qwen36-vectors = "qwen36_vectors:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "pysrc"
module-name = ["qsutil", "qstriton", "qwen36_vectors"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13,<1",
    "ty>=0.0.61,<0.1",
]
